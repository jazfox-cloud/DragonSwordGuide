<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title desc">
<title id="title">Choose the SSD as the game's installation drive</title><desc id="desc">A game folder points to a solid-state drive inside a computer. Check the installation destination, not merely whether the computer contains an SSD.</desc>
<rect width="480" height="400" rx="20" fill="#142231"/>
<g font-family="Arial, sans-serif">
<text x="28" y="43" fill="#7dd3fc" font-size="15" font-weight="700" letter-spacing="2">INSTALLATION CHECK</text>
<text x="28" y="82" fill="#f4f7fa" font-size="28" font-weight="700">Where will the game go?</text>
<rect x="30" y="119" width="420" height="209" rx="17" fill="#0d1723" stroke="#3a5267" stroke-width="2"/>
<path d="M57 164v-24h49l17 16h52v74H57z" fill="#255878" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round"/>
<text x="116" y="203" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">GAME</text>
<path d="M191 195h45m-12-12 13 12-13 12" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="259" y="140" width="158" height="115" rx="14" fill="#203c46" stroke="#78d8bf" stroke-width="3"/>
<circle cx="276" cy="156" r="3" fill="#78d8bf"/><circle cx="400" cy="156" r="3" fill="#78d8bf"/>
<rect x="286" y="170" width="103" height="56" rx="5" fill="#0d242b"/>
<text x="338" y="208" text-anchor="middle" fill="#b3f2df" font-size="32" font-weight="700">SSD</text>
<path d="M288 255v12m14-12v12m14-12v12m14-12v12m14-12v12m14-12v12m14-12v12m14-12v12" stroke="#78d8bf" stroke-width="4"/>
<text x="240" y="303" text-anchor="middle" fill="#d2dee8" font-size="21">Choose this installation destination.</text>
<text x="28" y="365" fill="#d2dee8" font-size="21">An SSD elsewhere in the PC is not enough.</text>
</g></svg>
